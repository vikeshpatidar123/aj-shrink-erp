<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">
  <rect width="200" height="240" fill="#f0f9ff" rx="8"/>
  <!-- Bottle body -->
  <rect x="70" y="40" width="60" height="150" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <!-- Sleeve band -->
  <rect x="60" y="80" width="80" height="90" rx="4" fill="#1d4ed8" opacity="0.85"/>
  <!-- Sleeve lines -->
  <line x1="60" y1="100" x2="140" y2="100" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="60" y1="150" x2="140" y2="150" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Label -->
  <text x="100" y="132" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="bold">SHRINK</text>
  <text x="100" y="145" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="bold">SLEEVE</text>
  <!-- Bottle cap -->
  <rect x="82" y="25" width="36" height="20" rx="5" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="220" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e40af" font-weight="bold">Shrink Sleeve</text>
</svg>