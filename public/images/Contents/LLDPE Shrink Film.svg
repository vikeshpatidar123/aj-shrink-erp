<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">
  <rect width="200" height="240" fill="#f0fdf4" rx="8"/>
  <!-- Roll body -->
  <ellipse cx="100" cy="100" rx="55" ry="20" fill="#86efac" stroke="#22c55e" stroke-width="2"/>
  <rect x="45" y="100" width="110" height="70" fill="#4ade80" stroke="#22c55e" stroke-width="0"/>
  <rect x="45" y="100" width="110" height="70" fill="url(#filmGrad)" stroke="none"/>
  <defs>
    <linearGradient id="filmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#86efac" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="170" rx="55" ry="20" fill="#4ade80" stroke="#22c55e" stroke-width="2"/>
  <!-- Film lines -->
  <line x1="45" y1="115" x2="155" y2="115" stroke="#15803d" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="45" y1="130" x2="155" y2="130" stroke="#15803d" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="45" y1="145" x2="155" y2="145" stroke="#15803d" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="45" y1="160" x2="155" y2="160" stroke="#15803d" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Text -->
  <text x="100" y="108" text-anchor="middle" font-family="Arial" font-size="8" fill="#14532d" font-weight="bold">LLDPE FILM</text>
  <text x="100" y="220" text-anchor="middle" font-family="Arial" font-size="11" fill="#15803d" font-weight="bold">LLDPE Shrink Film</text>
</svg>