<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">
  <rect width="200" height="240" fill="#f0fdf4" rx="8"/>
  <!-- Flat bottom rectangular shape -->
  <rect x="48" y="55" width="104" height="130" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="2.5"/>
  <!-- Flat bottom panel -->
  <rect x="48" y="165" width="104" height="20" rx="0" fill="#86efac" stroke="#22c55e" stroke-width="2"/>
  <!-- Corner folds -->
  <line x1="48" y1="165" x2="38" y2="175" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="152" y1="165" x2="162" y2="175" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Top seal -->
  <rect x="48" y="55" width="104" height="12" rx="0" fill="#16a34a" opacity="0.7"/>
  <!-- Side seals -->
  <rect x="48" y="55" width="8" height="130" fill="#16a34a" opacity="0.5"/>
  <rect x="144" y="55" width="8" height="130" fill="#16a34a" opacity="0.5"/>
  <!-- Label area -->
  <rect x="70" y="85" width="60" height="65" rx="4" fill="white" opacity="0.6"/>
  <text x="100" y="121" text-anchor="middle" font-family="Arial" font-size="8" fill="#14532d">PRODUCT</text>
  <text x="100" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#15803d" font-weight="bold">Flat Bottom - Standard</text>
</svg>