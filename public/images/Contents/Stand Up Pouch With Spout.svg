  <line x1="145" y1="70" x2="152" y2="162" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e40af" font-weight="bold">Stand Up - With Spout</text>
