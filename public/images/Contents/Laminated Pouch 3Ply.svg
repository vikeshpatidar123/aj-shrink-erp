  <text x="100" y="116" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#4338ca">Barrier Layer</text>
  <!-- Adh 2 -->
  <rect x="28" y="124" width="144" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
