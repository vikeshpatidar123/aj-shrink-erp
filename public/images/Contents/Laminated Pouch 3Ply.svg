  <!-- Adh 1 -->
  <rect x="28" y="76" width="144" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="86" text-anchor="middle" font-family="Arial" font-size="7" fill="#92400e">── Adhesive ──</text>
  <!-- Layer 2 -->
  <rect x="28" y="90" width="144" height="32" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
