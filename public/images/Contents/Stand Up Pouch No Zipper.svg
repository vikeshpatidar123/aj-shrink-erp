  <line x1="55" y1="58" x2="48" y2="162" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <line x1="145" y1="58" x2="152" y2="162" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <!-- Label area -->
  <rect x="68" y="90" width="64" height="60" rx="4" fill="white" opacity="0.5"/>
  <text x="100" y="124" text-anchor="middle" font-family="Arial" font-size="8" fill="#1e3a8a">PRODUCT</text>
  <text x="100" y="220" text-anchor="middle" font-family="Arial" font-size="10" fill="#1e40af" font-weight="bold">Stand Up - No Zipper</text>
</svg>