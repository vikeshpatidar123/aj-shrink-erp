<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">
  <rect width="200" height="240" fill="#fdf4ff" rx="8"/>
  <!-- Sachet body -->
  <rect x="40" y="60" width="120" height="140" rx="4" fill="#e9d5ff" stroke="#a855f7" stroke-width="2.5"/>
  <!-- 3 sealed edges -->
  <rect x="40" y="60" width="120" height="12" rx="0" fill="#7c3aed" opacity="0.8"/>
  <rect x="40" y="60" width="10" height="140" fill="#7c3aed" opacity="0.8"/>
  <rect x="150" y="60" width="10" height="140" fill="#7c3aed" opacity="0.8"/>
  <!-- TEAR NOTCH on right side -->
  <polygon points="160,90 155,97 160,104" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="167" y="99" font-family="Arial" font-size="7" fill="#d97706" font-weight="bold">NOTCH</text>
  <!-- Tear line -->
  <line x1="155" y1="97" x2="50" y2="97" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Bottom open -->
  <path d="M50,200 L150,200" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- Label -->
  <rect x="65" y="110" width="70" height="70" rx="4" fill="white" opacity="0.5"/>
  <text x="100" y="148" text-anchor="middle" font-family="Arial" font-size="8" fill="#581c87">SACHET</text>
  <text x="100" y="228" text-anchor="middle" font-family="Arial" font-size="10" fill="#7c3aed" font-weight="bold">3-Side Seal - Tear Notch</text>
</svg>