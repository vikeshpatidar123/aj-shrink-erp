<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">
  <rect width="200" height="240" fill="#f8fafc" rx="8"/>
  <text x="100" y="38" text-anchor="middle" font-family="Arial" font-size="11" fill="#334155" font-weight="bold">2-PLY STRUCTURE</text>
  <!-- Layer 1 -->
  <rect x="30" y="55" width="140" height="42" rx="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="72" text-anchor="middle" font-family="Arial" font-size="9" fill="#1e3a8a" font-weight="bold">Layer 1 — Outer</text>
  <text x="100" y="87" text-anchor="middle" font-family="Arial" font-size="8" fill="#1e40af">BOPP / PET (Printed)</text>
  <!-- Adhesive line -->
  <rect x="30" y="100" width="140" height="14" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="100" y="111" text-anchor="middle" font-family="Arial" font-size="7.5" fill="#92400e">── Adhesive / Lamination ──</text>
  <!-- Layer 2 -->
  <rect x="30" y="117" width="140" height="42" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="2"/>
  <text x="100" y="134" text-anchor="middle" font-family="Arial" font-size="9" fill="#14532d" font-weight="bold">Layer 2 — Inner (Seal)</text>
  <text x="100" y="149" text-anchor="middle" font-family="Arial" font-size="8" fill="#15803d">CPP / PE / LLDPE</text>
  <!-- Total thickness arrow -->
  <line x1="22" y1="55" x2="22" y2="159" stroke="#64748b" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="14" y="110" text-anchor="middle" font-family="Arial" font-size="7" fill="#64748b" transform="rotate(-90,14,110)">~55–80 μ</text>
  <text x="100" y="220" text-anchor="middle" font-family="Arial" font-size="11" fill="#334155" font-weight="bold">Laminated - 2 Ply</text>
</svg>